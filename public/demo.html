<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="cache-control" content="no-cache">
<title>iBek · live</title>
<link rel="icon" href="/logo.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif;color:#111418;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px;text-align:center}
.lg{height:40px}
.row{display:flex;gap:8px;width:100%;max-width:340px}
input{flex:1;min-width:0;height:48px;border:1.5px solid #d6d9dd;border-radius:14px;padding:0 14px;font:600 17px inherit;font-family:inherit;outline:none}
input:focus{border-color:#111418}
#go{width:220px;height:220px;border-radius:50%;border:0;background:#111418;color:#fff;font:700 26px inherit;font-family:inherit;cursor:pointer;display:grid;place-items:center;transition:transform .1s;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
#go:active{transform:scale(.96)}
#go:disabled{background:#9aa1ab}
#go svg{width:56px;height:56px;margin-bottom:6px}
#st{min-height:52px;max-width:340px;font-size:17px;font-weight:600}
#st.ok{color:#1f7a47}#st.err{color:#d93025}
#log{max-width:360px;color:#6b7280;font-size:14px;min-height:40px}
small{color:#9aa1ab}
</style>
</head>
<body>
  <img class="lg" src="/logo.png" alt="iBek">
  <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"></div>
  <div class="row"><input id="to" type="tel" inputmode="tel" placeholder="Number (empty = presenter)" autocomplete="off"></div>
  <button id="go"><div><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><div>CALL</div></div></button>
  <button id="app" style="height:52px;padding:0 26px;border-radius:999px;border:1.5px solid #111418;background:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer">📱 App call (backup)</button>
  <div id="st"></div>
  <div id="log"></div>
  <small>Tap once. If nothing rings in ~10 s, tap again.</small>
<script>
const $ = s => document.querySelector(s);
try { $('#pin').value = localStorage.getItem('ibek-pin') || ''; $('#to').value = localStorage.getItem('ibek-to') || ''; } catch {}
let poll = null;
async function status(id, pin) {
  clearInterval(poll); let n = 0;
  poll = setInterval(async () => {
    if (++n > 90) return clearInterval(poll);
    try {
      const r = await fetch(`/api/demo-status?pin=${encodeURIComponent(pin)}&id=${encodeURIComponent(id)}`); const j = await r.json();
      const map = { initiated: 'Ringing…', 'in-progress': 'On the call ✓', processing: 'Call ended', done: 'Call ended', failed: 'Call failed' };
      if (j.status) { $('#st').textContent = map[j.status] || j.status; $('#st').className = j.status === 'failed' ? 'err' : 'ok'; }
      if (j.last && j.last.length) $('#log').textContent = j.last.map(m => (m.role === 'agent' ? 'iBek: ' : 'Them: ') + m.text).join('  ·  ');
      if (j.status === 'failed' && j.reason) $('#log').textContent = j.reason;
      if (['done', 'failed'].includes(j.status)) { clearInterval(poll); $('#go').disabled = false; }
    } catch {}
  }, 2000);
}
$('#go').onclick = async () => {
  const pin = $('#pin').value.trim(), to = $('#to').value.trim();
  try { localStorage.setItem('ibek-pin', pin); localStorage.setItem('ibek-to', to); } catch {}
  $('#go').disabled = true; $('#st').className = ''; $('#st').textContent = 'Starting call…'; $('#log').textContent = '';
  try {
    const r = await fetch('/api/demo-call', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin, to }) });
    const j = await r.json();
    if (j.ok) { $('#st').className = 'ok'; $('#st').textContent = 'Calling now…'; if (j.conversation) status(j.conversation, pin); setTimeout(() => $('#go').disabled = false, 8000); }
    else { $('#st').className = 'err'; $('#st').textContent = j.reason || 'Failed'; $('#go').disabled = false; }
  } catch (e) { $('#st').className = 'err'; $('#st').textContent = 'Network error, tap again'; $('#go').disabled = false; }
};

$('#app').onclick = async () => {
  const pin = $('#pin').value.trim(); try { localStorage.setItem('ibek-pin', pin); } catch {}
  $('#st').className = ''; $('#st').textContent = 'Ringing the app…';
  try {
    const j = await (await fetch('/api/live-ring', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin }) })).json();
    if (j.ok) { $('#st').className = 'ok'; $('#st').textContent = 'App is ringing (opens on ibek.space/live)'; }
    else { $('#st').className = 'err'; $('#st').textContent = j.reason || 'Failed'; }
  } catch { $('#st').className = 'err'; $('#st').textContent = 'Network error'; }
};
</script>
</body>
</html>
