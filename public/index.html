<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>iBek</title>
<meta name="description" content="iBek buys commodities on UZEX for you. Text, call, or ask.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23111'/%3E%3Ctext x='32' y='41' font-family='-apple-system,Helvetica' font-size='24' font-weight='600' text-anchor='middle' fill='%23fff'%3EiB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff; --text:#000; --sub:#8e8e93; --line:rgba(60,60,67,.12);
  --them:#e9e9eb; --themText:#000; --me:#007aff; --meText:#fff;
  --field:#fff; --fieldLine:#c7c7cc; --bar:rgba(249,249,249,.94);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --text:#fff; --sub:#8e8e93; --line:rgba(84,84,88,.6);
    --them:#26252a; --themText:#fff; --me:#0a84ff; --field:#000; --fieldLine:#3a3a3c; --bar:rgba(22,22,24,.94); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

header{flex:none;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;position:relative;text-align:center}
.av{width:44px;height:44px;border-radius:50%;margin:0 auto 4px;background:linear-gradient(180deg,#a1a1a6,#86868b);color:#fff;display:grid;place-items:center;font-weight:600;font-size:17px;letter-spacing:-.02em}
.name{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:2px}
.name svg{width:9px;height:9px;opacity:.5}
.call{position:absolute;right:16px;top:calc(22px + env(safe-area-inset-top));color:var(--me);width:36px;height:36px;display:grid;place-items:center}
.call svg{width:22px;height:22px}
.call[hidden]{display:none}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.thread{max-width:720px;margin:0 auto;padding:14px 14px 20px;display:flex;flex-direction:column}
.stamp{text-align:center;color:var(--sub);font-size:11px;margin:6px 0 10px}
.stamp b{font-weight:600}

.b{max-width:76%;padding:7px 12px 8px;border-radius:18px;margin-top:2px;position:relative;white-space:pre-wrap;word-wrap:break-word;font-size:17px;line-height:1.3;animation:in .22s ease-out both}
.b.them{align-self:flex-start;background:var(--them);color:var(--themText)}
.b.me{align-self:flex-end;background:var(--me);color:var(--meText)}
.b.gap{margin-top:12px}
.b a{text-decoration:underline}
/* tail only on last bubble of a group */
.b.tail.them{border-bottom-left-radius:4px}
.b.tail.me{border-bottom-right-radius:4px}
.b.tail.them::before{content:"";position:absolute;left:-6px;bottom:0;width:14px;height:14px;background:var(--them);border-bottom-right-radius:12px 10px}
.b.tail.them::after{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:14px;background:var(--bg);border-bottom-right-radius:8px}
.b.tail.me::before{content:"";position:absolute;right:-6px;bottom:0;width:14px;height:14px;background:var(--me);border-bottom-left-radius:12px 10px}
.b.tail.me::after{content:"";position:absolute;right:-10px;bottom:0;width:10px;height:14px;background:var(--bg);border-bottom-left-radius:8px}
.b.err{background:transparent;color:#ff3b30;border:1px solid rgba(255,59,48,.35)}
.b.err::before,.b.err::after{display:none}
.meta{align-self:flex-start;color:var(--sub);font-size:11px;margin:3px 0 0 6px}
.meta button{color:var(--sub);font-size:11px}
.meta button.on{color:var(--me)}
.pic{align-self:flex-start;margin-top:4px;max-width:min(76%,520px);border-radius:18px;overflow:hidden;background:#fff;border:.5px solid var(--line);cursor:zoom-in;animation:in .22s ease-out both}
.pic img{display:block;width:100%;height:auto}
.pic.loading{width:220px;height:140px;display:grid;place-items:center;background:var(--them);border:0;cursor:default}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;background:#fff;border-radius:12px}
@keyframes in{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}

.dots{display:inline-flex;gap:4px;padding:5px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sub);opacity:.4;animation:d 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{0%,60%,100%{opacity:.3}30%{opacity:.9}}

.sugg{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:14px}
.sugg button{border:1px solid var(--me);color:var(--me);border-radius:16px;padding:6px 12px;font-size:15px}
.sugg button:active{background:var(--me);color:#fff}

footer{flex:none;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
form{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
.field{flex:1;display:flex;align-items:flex-end;border:1px solid var(--fieldLine);border-radius:19px;background:var(--field);min-height:36px;padding:0 4px 0 12px}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:17px/1.3 inherit;font-family:inherit;padding:7px 0;max-height:132px}
textarea::placeholder{color:var(--sub)}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;margin:2px 0}
.ic svg{width:18px;height:18px}
.mic{color:var(--sub)}
.mic.on{color:#ff3b30}
.send{background:var(--me);color:#fff}
.send svg{width:16px;height:16px}
.send[hidden],.mic[hidden]{display:none}
.lang{color:var(--sub);font-size:12px;font-weight:600;width:28px;height:36px;flex:none}
.note{max-width:720px;margin:6px auto 0;text-align:center;color:var(--sub);font-size:11px;min-height:14px}
</style>
</head>
<body>

<header>
  <div class="av">iB</div>
  <div class="name">iBek</div>
  <a class="call" id="call" hidden aria-label="Call iBek"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></a>
</header>

<main id="main">
  <div class="thread" id="t">
    <div class="stamp"><b>iBek</b> · Commodity exchange agent<br>Today <span id="now"></span></div>
  </div>
</main>

<footer>
  <form id="f" autocomplete="off">
    <button type="button" class="lang" id="lang" aria-label="Voice language">EN</button>
    <div class="field">
      <textarea id="q" rows="1" placeholder="Message" aria-label="Message"></textarea>
      <button type="button" class="ic mic" id="mic" aria-label="Dictate"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.6a.9.9 0 1 0-1.8 0 4.2 4.2 0 0 1-8.4 0 .9.9 0 1 0-1.8 0 6 6 0 0 0 5.1 5.9V20H8.9a.9.9 0 1 0 0 1.8h6.2a.9.9 0 1 0 0-1.8h-2.2v-2.7a6 6 0 0 0 5.1-5.9z"/></svg></button>
      <button type="submit" class="ic send" id="send" hidden aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    </div>
  </form>
  <div class="note" id="note"></div>
</footer>
<div class="lb" id="lb"><img alt=""></div>

<script>
const $ = s => document.querySelector(s);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const t = $('#t'), main = $('#main'), q = $('#q'), send = $('#send'), mic = $('#mic'), note = $('#note');
const fmt = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
$('#now').textContent = fmt(new Date());

let phone = '';
const history = [];
let busy = false, lastSide = null, lastEl = null;

function add(side, text, opts = {}) {
  if (lastEl && lastSide === side) lastEl.classList.remove('tail');
  const el = document.createElement('div');
  el.className = 'b ' + side + ' tail' + (lastSide && lastSide !== side ? ' gap' : '');
  if (opts.html) el.innerHTML = text; else el.textContent = text;
  t.appendChild(el);
  lastSide = side; lastEl = el;
  scroll();
  return el;
}
const scroll = () => requestAnimationFrame(() => main.scrollTop = main.scrollHeight);
const wait = ms => new Promise(r => setTimeout(r, ms));
const clean = s => s.replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#+\s*/gm, '').replace(/`/g, '');

// ---------- opening thread ----------
async function intro() {
  const lines = [
    "Hi. I'm iBek.",
    "I buy commodities on the Uzbek exchange for you. Cement, fuel, grain, metal.",
    "Tell me what you need and the most you'll pay. I place a sealed bid and report back.",
    "Everyone who wins a round pays the same price. Speed doesn't matter, and your limit is never exceeded.",
    () => phone ? `Text or call me at ${phone}.` : "Text or call me. My number will appear here.",
    "Or ask me anything about how I work."
  ];
  for (const l of lines) {
    const typing = add('them', '<span class="dots"><i></i><i></i><i></i></span>', { html: true });
    await wait(450);
    typing.textContent = typeof l === 'function' ? l() : l;
    if (typing.textContent.includes(phone) && phone) typing.innerHTML = typing.textContent.replace(phone, `<a href="sms:${phone.replace(/[^\d+]/g, '')}">${phone}</a>`);
    await wait(200);
  }
  const s = document.createElement('div'); s.className = 'sugg'; s.id = 'sugg';
  ["How is this different from an AI assistant?", "Why is one price fairer?", "What if the agent makes a mistake?"].forEach(x => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = x; b.onclick = () => ask(x); s.appendChild(b);
  });
  t.appendChild(s); scroll();
}

fetch('/api/config').then(r => r.json()).then(c => {
  phone = c.phone || '';
  if (phone) { const c2 = $('#call'); c2.href = 'tel:' + phone.replace(/[^\d+]/g, ''); c2.hidden = false; }
}).catch(() => {}).finally(intro);

// ---------- composer ----------
function sync() {
  const has = !!q.value.trim();
  send.hidden = !has; mic.hidden = has || !SR;
  q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 132) + 'px';
}
q.addEventListener('input', sync);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#f').requestSubmit(); } });
$('#f').addEventListener('submit', e => { e.preventDefault(); const v = q.value.trim(); if (v) ask(v); });

// ---------- answers: text + visuals ----------
function parse(full) {
  // split into text and ```chart / ```svg blocks; an unclosed block is "pending"
  const out = []; const re = /```(chart|svg)\s*\n?([\s\S]*?)(```|$)/g; let i = 0, m;
  while ((m = re.exec(full))) {
    if (m.index > i) out.push({ k: 'text', v: full.slice(i, m.index) });
    out.push({ k: m[1], v: m[2], done: m[3] === '```' });
    i = re.lastIndex;
  }
  if (i < full.length) out.push({ k: 'text', v: full.slice(i) });
  return out.map(x => x.k === 'text' ? { ...x, v: clean(x.v).replace(/```\w*$/, '').trim() } : x).filter(x => x.k !== 'text' || x.v);
}
const svgUrl = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
const xesc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function nfmt(v) {
  const a = Math.abs(v);
  if (a >= 1e12) return +(v / 1e12).toFixed(1) + 'T';
  if (a >= 1e9) return +(v / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return +(v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e4) return +(v / 1e3).toFixed(0) + 'k';
  return +(+v).toFixed(2) + '';
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
const PAL = ['#007aff', '#1c1c1e', '#8e8e93', '#34c759'];
const FONT = '-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif';
function chartSvg(c) {
  const labels = (c.labels || []).map(String), series = (c.series || []).filter(s => Array.isArray(s.values));
  if (!labels.length || !series.length) throw new Error('empty chart');
  const type = c.type || 'bar', W = 640, top = 64, multi = series.length > 1;
  const noteLines = []; if (c.note) { let cur = ''; for (const w of String(c.note).split(/\s+/)) { if ((cur + ' ' + w).trim().length > 98) { noteLines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); } if (cur) noteLines.push(cur); }
  const legendH = multi ? 26 : 0, noteH = noteLines.length ? 12 + noteLines.length * 15 : 0;
  let body = '', H;
  const max = niceMax(Math.max(...series.flatMap(s => s.values.map(Number).filter(isFinite)), 0));
  if (type === 'hbar') {
    const rowH = 38, lw = Math.min(220, 12 + Math.max(...labels.map(l => l.length)) * 7.4), x0 = 24 + lw, x1 = W - 70;
    H = top + legendH + labels.length * rowH * (multi ? series.length * .6 + .4 : 1) + noteH + 20;
    let y = top + legendH;
    labels.forEach((l, i) => {
      const gh = multi ? series.length * 16 + 10 : 24, bh = multi ? 12 : 22;
      body += `<text x="${x0 - 12}" y="${y + gh / 2 + 5}" text-anchor="end" font-size="14" fill="#1c1c1e">${xesc(l)}</text>`;
      series.forEach((s, j) => {
        const v = +s.values[i] || 0, w = Math.max(2, (x1 - x0) * v / max), by = y + (multi ? 5 + j * 16 : 1);
        body += `<rect x="${x0}" y="${by}" width="${w}" height="${bh}" rx="${bh / 2.5}" fill="${PAL[j % 4]}"/>`;
        body += `<text x="${x0 + w + 8}" y="${by + bh / 2 + 4.5}" font-size="${multi ? 11.5 : 13}" fill="#3a3a3c">${nfmt(v)}</text>`;
      });
      y += multi ? gh + 12 : rowH;
    });
    H = y + noteH + 12;
  } else {
    H = 400 + legendH;
    const x0 = 64, x1 = W - 24, y0 = top + legendH + 10, y1 = H - 48 - noteH;
    for (let k = 0; k <= 4; k++) {
      const v = max * k / 4, y = y1 - (y1 - y0) * k / 4;
      body += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="#e5e5ea"/><text x="${x0 - 10}" y="${y + 4}" text-anchor="end" font-size="12" fill="#8e8e93">${nfmt(v)}</text>`;
    }
    const n = labels.length, step = (x1 - x0) / n;
    labels.forEach((l, i) => body += `<text x="${x0 + step * (i + .5)}" y="${y1 + 22}" text-anchor="middle" font-size="${n > 8 ? 11 : 13}" fill="#3a3a3c">${xesc(l.length > 14 ? l.slice(0, 13) + '…' : l)}</text>`);
    if (type === 'line') {
      series.forEach((s, j) => {
        const pts = s.values.map((v, i) => [x0 + step * (i + .5), y1 - (y1 - y0) * (+v || 0) / max]);
        body += `<polyline fill="none" stroke="${PAL[j % 4]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
        pts.forEach((p, i) => body += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="${PAL[j % 4]}" stroke-width="2.5"/>` + (multi ? '' : `<text x="${p[0]}" y="${p[1] - 12}" text-anchor="middle" font-size="12" fill="#1c1c1e">${nfmt(+s.values[i] || 0)}</text>`));
      });
    } else {
      const gw = step * .66, bw = gw / series.length;
      labels.forEach((l, i) => series.forEach((s, j) => {
        const v = +s.values[i] || 0, h = (y1 - y0) * v / max, x = x0 + step * i + (step - gw) / 2 + j * bw;
        body += `<rect x="${x + 2}" y="${y1 - h}" width="${bw - 4}" height="${h}" rx="5" fill="${PAL[j % 4]}"/>`;
        if (!multi || series.length <= 2) body += `<text x="${x + bw / 2}" y="${y1 - h - 7}" text-anchor="middle" font-size="12" fill="#1c1c1e">${nfmt(v)}</text>`;
      }));
    }
  }
  let legend = '';
  if (multi) { let lx = 24; series.forEach((s, j) => { legend += `<rect x="${lx}" y="${top - 4}" width="10" height="10" rx="5" fill="${PAL[j % 4]}"/><text x="${lx + 16}" y="${top + 5}" font-size="13" fill="#3a3a3c">${xesc(s.name)}</text>`; lx += 34 + String(s.name || '').length * 7.5; }); }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${FONT}"><rect width="100%" height="100%" fill="#fff"/>`
    + `<text x="24" y="34" font-size="18" font-weight="600" fill="#1c1c1e">${xesc(c.title || '')}</text>`
    + (c.unit ? `<text x="${W - 24}" y="34" text-anchor="end" font-size="12" fill="#8e8e93">${xesc(c.unit)}</text>` : '')
    + legend + body
    + noteLines.map((l, k) => `<text x="24" y="${H - 14 - (noteLines.length - 1 - k) * 15}" font-size="11" fill="#8e8e93">${xesc(l)}</text>`).join('') + '</svg>';
}
function visualUrl(seg) {
  if (seg.k === 'chart') return svgUrl(chartSvg(JSON.parse(seg.v)));
  let svg = seg.v.trim();
  if (!/^<svg[\s>]/i.test(svg)) throw new Error('bad svg');
  if (!/xmlns=/.test(svg)) svg = svg.replace(/^<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  return svgUrl(svg);
}
const lb = $('#lb');
lb.onclick = () => lb.classList.remove('open');

function renderAnswer(group, full, final = false) {
  // group: {els: []}; re-render all parts of this answer
  const segs = parse(full).map(x => final && x.k !== 'text' ? { ...x, done: true } : x);
  segs.forEach((seg, idx) => {
    let el = group.els[idx];
    const isPic = seg.k !== 'text';
    if (el && (el.dataset.kind === 'pic') !== isPic) { el.remove(); el = null; }
    if (!el) {
      if (isPic) { el = document.createElement('div'); el.className = 'pic loading'; el.dataset.kind = 'pic'; el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; }
      else { el = document.createElement('div'); el.className = 'b them'; el.dataset.kind = 'text'; }
      if (idx === 0) el.style.marginTop = '12px';
      const anchor = group.els[idx - 1] || group.start;
      anchor.after(el); group.els[idx] = el;
    }
    if (!isPic) el.textContent = seg.v;
    else if (seg.done && !el.dataset.ok) {
      try {
        const url = visualUrl(seg), img = new Image(); img.alt = 'Chart'; img.src = url;
        img.onerror = () => { el.className = 'b them'; el.dataset.kind = 'text'; el.onclick = null; el.textContent = '(The picture could not be drawn. Ask again.)'; };
        el.className = 'pic'; el.innerHTML = ''; el.appendChild(img); el.dataset.ok = '1';
        el.onclick = () => { lb.querySelector('img').src = url; lb.classList.add('open'); };
      } catch { el.className = 'b them'; el.dataset.kind = 'text'; el.textContent = '(The picture could not be drawn. Ask again.)'; el.dataset.ok = '1'; }
    }
  });
  // tails: last text bubble only
  group.els.forEach(e => e.classList?.remove('tail'));
  const lastText = [...group.els].reverse().find(e => e.dataset.kind === 'text');
  if (lastText && group.els[group.els.length - 1] === lastText) lastText.classList.add('tail');
  scroll();
}
const speakable = full => parse(full).filter(s => s.k === 'text').map(s => s.v).join(' ').trim();

async function ask(text, spoken = false) {
  if (busy) return;
  busy = true;
  $('#sugg')?.remove();
  q.value = ''; sync();
  add('me', text);
  history.push({ role: 'user', content: text });
  const typing = add('them', '<span class="dots"><i></i><i></i><i></i></span>', { html: true });
  const group = { start: typing, els: [] };
  let full = '';
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages: history }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Not delivered. Try again.'); }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let first = true;
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      full += dec.decode(value, { stream: true });
      if (first && parse(full).length) {
        first = false;
        const marker = document.createElement('span'); marker.style.display = 'none';
        typing.replaceWith(marker); group.start = marker;
      }
      if (!first) renderAnswer(group, full);
    }
    if (!first) renderAnswer(group, full, true);
    if (!full.trim()) throw new Error('Not delivered. Try again.');
    history.push({ role: 'assistant', content: full });
    lastSide = 'them'; lastEl = group.els[group.els.length - 1];
    const say = speakable(full);
    if (say) {
      const meta = document.createElement('div'); meta.className = 'meta';
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Play';
      b.onclick = () => play(say, b);
      meta.appendChild(b); (lastEl || group.start).after(meta); lastEl = meta; scroll();
      if (spoken) play(say, b);
    }
  } catch (err) {
    history.pop();
    const el = group.els[0] || typing;
    if (!el.isConnected) group.start.after(el);
    el.classList?.add('err'); el.className = 'b them err'; el.textContent = err.message;
    group.els.slice(1).forEach(e => e.remove());
    lastSide = 'them'; lastEl = el;
  } finally {
    busy = false;
  }
}

// ---------- voice ----------
const LANGS = [['EN', 'en-US'], ['UZ', 'uz-UZ'], ['RU', 'ru-RU']];
let li = (() => { const n = (navigator.language || '').toLowerCase(); return n.startsWith('uz') ? 1 : n.startsWith('ru') ? 2 : 0; })();
try { const s = localStorage.getItem('ibek-lang'); if (s !== null) li = +s; } catch {}
const langBtn = $('#lang');
const showLang = () => langBtn.textContent = LANGS[li][0];
showLang();
langBtn.onclick = () => { li = (li + 1) % LANGS.length; showLang(); try { localStorage.setItem('ibek-lang', li); } catch {} };

let rec = null, on = false;
if (!SR) { mic.hidden = true; langBtn.hidden = true; }

mic.onclick = () => {
  if (on) { rec.stop(); return; }
  stopAudio();
  rec = new SR(); rec.lang = LANGS[li][1]; rec.interimResults = true; rec.continuous = false;
  rec.onstart = () => { on = true; mic.classList.add('on'); note.textContent = 'Listening…'; };
  rec.onresult = e => { let s = ''; for (const r of e.results) s += r[0].transcript; q.value = s; q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 132) + 'px'; };
  rec.onerror = e => { note.textContent = e.error === 'not-allowed' ? 'Microphone access is off.' : e.error === 'no-speech' ? 'Nothing heard.' : ''; };
  rec.onend = () => {
    on = false; mic.classList.remove('on');
    if (note.textContent === 'Listening…') note.textContent = '';
    const v = q.value.trim(); if (v) ask(v, true); else sync();
  };
  try { rec.start(); } catch {}
};

let tts = false, audio = null, playingBtn = null;
fetch('/api/config').then(r => r.json()).then(c => tts = !!c.tts).catch(() => {});
function stopAudio() {
  if (audio) { audio.pause(); audio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (playingBtn) { playingBtn.textContent = 'Play'; playingBtn.classList.remove('on'); playingBtn = null; }
}
async function play(text, btn) {
  const was = playingBtn === btn;
  stopAudio();
  if (was) return;
  playingBtn = btn; btn.classList.add('on'); btn.textContent = 'Loading…';
  const done = () => { if (playingBtn === btn) { btn.textContent = 'Play'; btn.classList.remove('on'); playingBtn = null; } };
  if (tts) {
    try {
      const r = await fetch('/api/tts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!r.ok) throw 0;
      const url = URL.createObjectURL(await r.blob());
      if (playingBtn !== btn) return;
      audio = new Audio(url); audio.onended = done; audio.onerror = done;
      btn.textContent = 'Stop';
      await audio.play();
      return;
    } catch { if (playingBtn !== btn) return; }
  }
  if (!('speechSynthesis' in window)) return done();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = /[а-яё]/i.test(text) ? 'ru-RU' : LANGS[li][1];
  const v = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(u.lang.slice(0, 2)));
  if (v) u.voice = v;
  u.onend = done; u.onerror = done;
  btn.textContent = 'Stop';
  speechSynthesis.speak(u);
}
</script>
</body>
